; ESP32 Alert Terminal — MQTT alarm display for the Security Camera system.
;
; Build:  pio run
; Flash:  pio run -t upload
; Serial: pio device monitor -b 115200
;
; The firmware subscribes to systems/<SYSTEM_ID>/alarm and renders the retained JSON document
; published by the ASP.NET Core backend onto a 16x2 I2C LCD while driving the LED/buzzer.
;
; Secrets (Wi-Fi password, SYSTEM_ID, MQTT credentials) are NOT committed. Copy
; include/config.example.h to include/config.h and fill it in; include/config.h is gitignored.

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Application-level library dependencies.
lib_deps =
    knolleary/PubSubClient@^2.8.0
    bblanchon/ArduinoJson@^7.0.4
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; The ESP32 core's built-in WiFi/HTTPClient stacks supply TLS and the HTTP fallback poll.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DALARM_TERMINAL_FIRMWARE_VERSION=\"1.0.0\"

; Keep the serial monitor clean of the Arduino core's own chatter.
build_unflags = -DCORE_DEBUG_LEVEL=5
