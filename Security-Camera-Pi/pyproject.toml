[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-camera-pi"
version = "0.1.0"
description = "Raspberry Pi 5 motion capture daemon for the Security Camera backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.8",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
security-camera-pi = "security_camera_pi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
