# Mosquitto broker for the Security Camera event-driven alert path.
#
# Two listeners, one broker:
#   * 1883 — plain MQTT for the ASP.NET Core backend and the ESP32 alert terminal (TCP).
#   * 9001 — MQTT over WebSockets for the Next.js dashboard (mqtt.js over wss://).
#
# Authentication is password-based and the file is generated at container start by
# entrypoint.sh from MQTT_BACKEND_USER/MQTT_BACKEND_PASS and MQTT_CLIENT_USER/MQTT_CLIENT_PASS.
# Topic access is restricted by acl (see ./acl): the backend may publish/read everything under
# systems/#, read-only clients (dashboards) may only subscribe to systems/<id>/alarm and
# systems/<id>/events.

per_listener_settings false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Keep the broker quiet-ish but still useful in `docker compose logs`.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# --- Device/backend listener ---------------------------------------------------------------
listener 1883 0.0.0.0
protocol mqtt
max_connections -1
max_qos 1
retain_available true

# --- Browser listener (mqtt.js over WebSockets) ---------------------------------------------
listener 9001 0.0.0.0
protocol websockets
max_connections -1
max_qos 1
retain_available true

# Mosquitto drops privileges to this user after binding the listeners.
user mosquitto
