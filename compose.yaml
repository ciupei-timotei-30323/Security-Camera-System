# Compose project name kept from the previous Security-Camera-Backend/compose.yaml location so
# existing containers and `docker compose down` keep working after the move.
#
# NETWORK MODEL (security-critical):
#   * `edge`     — the only network with a published host port. Only `dashboard` joins it.
#   * `internal` — a private bridge with NO published ports. The backend, cv-service,
#                  external-auth-service and mailpit live only here, so nothing on the host, LAN
#                  or internet can open a connection to them.
#   Egress is deliberately kept (Neon PostgreSQL and the factory IAM service are external), so the
#   network is not `internal: true`; reachability is controlled by publishing no host ports at
#   all rather than by cutting the default gateway.
#   Net effect: only the Next.js dashboard is publicly reachable. The backend, PostgreSQL,
#   cv-service and the Raspberry Pi(s) are reachable only over Docker networking or the private
#   Tailscale mesh (map remote sites in the dashboard's EDGE_BACKENDS_JSON).
#
# HOW THE PI REACHES THE BACKEND:
#   The backend publishes no host port, so a Pi cannot use http://<lan-ip>:8080. Instead the
#   `tailscale` sidecar below joins the tailnet from *inside the backend's network namespace*
#   (`network_mode: service:security-camera-backend`). The backend already listens on 0.0.0.0
#   (:8080), so it answers on the tailscale0 interface with no extra binding. Pis, ESP32
#   terminals and remote dashboards then use http://$TS_HOSTNAME:8080 over the mesh:
#       docker compose --profile tailscale up -d
#   Nothing is exposed to the LAN, and the dashboard's EDGE_BACKENDS_JSON can point at the same
#   tailnet name for remote sites.
#
# EVENT-DRIVEN ADDITIONS (explicit, documented exceptions to the "only dashboard is published"
# rule):
#   * `mosquitto` — MQTT broker. 1883 is published for the ESP32 terminals and the Pi LAN, 9001 for
#     dashboard WebSockets. In production put both behind your reverse proxy/tunnel and require
#     mqtts:// and wss:// instead of exposing them raw.
#   * `mediamtx` — RTSP ingest (8554) and WebRTC WHEP signalling (8889) plus the ICE UDP port
#     (8189/udp). Browsers must reach 8889/8189 directly; the Pi must reach 8554.
#   Neither service is reachable from the internet unless you publish it deliberately.
name: security-camera-backend

services:
  security-camera-backend:
    image: security-camera-backend
    build:
      context: ./Security-Camera-Backend
      dockerfile: Dockerfile
    environment:
      DB_URL: ${DB_URL}
      PiAuth__ApiKey: ${PiAuth__ApiKey}
      PiAuth__DefaultSystemId: ${PiAuth__DefaultSystemId:-sys-001}
      # Optional: pin this Pi/backend to its own system id. When set, JWTs carrying a different
      # `system_id` claim are rejected outright.
      PiAuth__NodeSystemId: ${PiAuth__NodeSystemId:-}
      # Every request reaches this container from the dashboard, so the login limiter must key on
      # the address the dashboard forwards (it only does so when TRUST_PROXY_HEADERS=true there).
      ReverseProxy__TrustForwardedHeaders: "true"
      # No sample-secret fallbacks: a production deploy must supply its own keys (the backend
      # refuses to start on dev-only-* values). Empty entries are simply ignored by the filter.
      PiAuth__Systems__sys-002: ${PiAuth__Systems__sys-002:-}
      PiAuth__AlertTerminalSystems__sys-001: ${PiAuth__AlertTerminalSystems__sys-001:-}
      PiAuth__AlertTerminalSystems__sys-002: ${PiAuth__AlertTerminalSystems__sys-002:-}
      Storage__CapturesDirectory: /data/captures
      CvService__BaseUrl: http://cv-service:8000
      CvService__TimeoutSeconds: 10
      Admin__DeviceCode: ${Admin__DeviceCode}
      Jwt__Secret: ${Jwt__Secret}
      # Short-lived dashboard tokens; every one carries a jti that logout revokes.
      Jwt__ExpirationMinutes: ${Jwt__ExpirationMinutes:-30}
      # Outbound suspect alerts. Mailpit catches development e-mail at http://localhost:8025.
      Notifications__EmailCooldownSeconds: ${Notifications__EmailCooldownSeconds:-60}
      Notifications__DashboardBaseUrl: ${Notifications__DashboardBaseUrl:-http://localhost:3000}
      Notifications__EmailRetryBaseDelayMilliseconds: ${Notifications__EmailRetryBaseDelayMilliseconds:-1000}
      Smtp__Host: ${Smtp__Host:-mailpit}
      Smtp__Port: ${Smtp__Port:-1025}
      Smtp__UseStartTls: ${Smtp__UseStartTls:-false}
      Smtp__Username: ${Smtp__Username:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__FromAddress: ${Smtp__FromAddress:-alerts@security-camera.local}
      Smtp__FromName: ${Smtp__FromName:-Security Camera}
      Alarm__DurationSeconds: ${Alarm__DurationSeconds:-15}
      # Event-driven alerts. The backend publishes retained alarm state and event summaries here.
      Mqtt__Enabled: ${Mqtt__Enabled:-true}
      Mqtt__Host: ${Mqtt__Host:-mosquitto}
      Mqtt__Port: ${Mqtt__Port:-1883}
      Mqtt__Username: ${MQTT_BACKEND_USER:-backend}
      Mqtt__Password: ${MQTT_BACKEND_PASS:-change-me-backend}
      Mqtt__TopicPrefix: ${Mqtt__TopicPrefix:-systems}
      # Factory-admin validation through the local external-auth-service (Neon-backed).
      ExternalAuth__UseStub: "false"
      ExternalAuth__BaseUrl: http://external-auth-service:3001
      ExternalAuth__TimeoutSeconds: ${ExternalAuth__TimeoutSeconds:-10}
      ExternalAuth__InternalSecret: ${INTERNAL_API_SECRET}
      # Stub accounts are intentionally absent here: this stack validates factory admins against
      # the real external-auth-service, and the backend refuses to boot with stub credentials
      # outside Development (see appsettings.Development.json for the local stub).
      # No wildcard CORS: the BFF is same-origin. Set a comma-separated list only if a browser
      # must call this backend directly (it normally must not, it has no public URL).
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-}
    # No published host port on purpose: the backend is reachable only on the internal network.
    expose:
      - "8080"
    networks:
      - internal
    volumes:
      # Shared with cv-service: raw frames in, face crops out. Never stored in PostgreSQL.
      - captures:/data/captures
    depends_on:
      cv-service:
        condition: service_healthy
      external-auth-service:
        condition: service_healthy
      mailpit:
        condition: service_started
      mosquitto:
        condition: service_started
    restart: unless-stopped
    # Container hardening: unprivileged user (set in the Dockerfile) + no new privileges.
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp


  # Joins the tailnet from inside the backend's network namespace, so the backend becomes reachable
  # at http://$TS_HOSTNAME:8080 without publishing a host port. Opt in explicitly:
  #     docker compose --profile tailscale up -d
  # It is in a profile rather than always-on so a deployment that does not need remote Pis keeps
  # the exact previous process set (and does not fail when TS_AUTHKEY is unset).
  tailscale:
    image: tailscale/tailscale:stable
    # Shares the backend's netns: tailscale0 appears next to eth0, and the backend's existing
    # `http://+:8080` listener answers on it. This container therefore must NOT set `networks:`.
    network_mode: "service:security-camera-backend"
    profiles:
      - tailscale
    environment:
      # Tagged + ephemeral key from https://login.tailscale.com/admin/settings/keys.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-security-camera-backend}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      # Node identity survives restarts, so the tailnet name and IP stay stable.
      - tailscale-state:/var/lib/tailscale
    # A kernel TUN device in the shared netns requires these two; they do not widen the backend.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      security-camera-backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "tailscale status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


  dashboard:
    image: security-camera-dashboard
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Server-side BFF target on the internal network. The browser only talks to the dashboard
      # origin; the backend has no public URL.
      BACKEND_URL: http://security-camera-backend:8080
      # Private per-system backends (Tailscale/LAN). Empty = single-backend fallback above.
      EDGE_BACKENDS_JSON: ${EDGE_BACKENDS_JSON:-}
      # Seals the bff_session cookie. Docker build fails fast at runtime if this is < 32 bytes.
      BFF_SESSION_SECRET: ${BFF_SESSION_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Factory-admin dispatch: validate credentials here, then log in to the returned system.
      EXTERNAL_AUTH_URL: http://external-auth-service:3001
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      NODE_ENV: production
      # Cookies are Secure by default in production and whenever x-forwarded-proto is https.
      # Compose defaults this to false for plain-HTTP LAN access.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Set to true only behind a proxy that overwrites X-Forwarded-For / CF-Connecting-IP
      # (Cloudflare, Traefik, Caddy). Forwarded client IPs feed the backend login limiter.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      # Public origin the BROWSER uses for MediaMTX WHEP playback. Empty = MJPEG fallback.
      MEDIAMTX_PUBLIC_URL: ${MEDIAMTX_PUBLIC_URL:-}
      # Public MQTT-over-WebSockets URL the BROWSER connects to. Empty = polling fallback.
      MQTT_PUBLIC_WS_URL: ${MQTT_PUBLIC_WS_URL:-}
      MQTT_PUBLIC_USER: ${MQTT_PUBLIC_USER:-dashboard}
      MQTT_PUBLIC_PASS: ${MQTT_PUBLIC_PASS:-change-me-dashboard}
    # The ONLY service published to the host/public ingress.
    ports:
      - "3000:3000"
    networks:
      - edge
      - internal
    depends_on:
      security-camera-backend:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


  external-auth-service:
    image: security-camera-external-auth
    build:
      context: ./external-auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${NEON_DB_URL}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      PORT: 3001
    # Internal only: never published to the host. Local `dotnet run` debugging should use the
    # `ExternalAuth__BaseUrl` override described in .env.example instead.
    expose:
      - "3001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


  mailpit:
    image: axllent/mailpit:v1.21
    # Development-only mail catcher. Bound to loopback so it can never be reached from another
    # host, and it is the one exception to the "no host ports" rule next to the dashboard.
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI: http://localhost:8025
    networks:
      - internal
    restart: unless-stopped


  cv-service:
    image: security-camera-cv-service
    build:
      context: ./Security-Camera-Backend/cv-service
      dockerfile: Dockerfile
    # Internal only. Never published; reachable at http://cv-service:8000 from the backend.
    expose:
      - "8000"
    networks:
      - internal
    volumes:
      # Must match the exact mount path (/data/captures) used by the backend
      - captures:/data/captures
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 100s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


  # MQTT broker for retained alarm state and live event notifications.
  # 1883 = backend + ESP32 terminals (TCP), 9001 = dashboard over WebSockets.
  mosquitto:
    image: eclipse-mosquitto:2
    # Published deliberately: the Pi and the ESP32 terminals live outside Docker. In production
    # terminate TLS in front of these ports (mqtts://8883, wss://9001) and do not expose them raw.
    ports:
      - "1883:1883"
      - "9001:9001"
    environment:
      MQTT_BACKEND_USER: ${MQTT_BACKEND_USER:-backend}
      MQTT_BACKEND_PASS: ${MQTT_BACKEND_PASS:-change-me-backend}
      MQTT_CLIENT_USER: ${MQTT_CLIENT_USER:-dashboard}
      MQTT_CLIENT_PASS: ${MQTT_CLIENT_PASS:-change-me-dashboard}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      # Generated password file and broker persistence survive container restarts.
      - mosquitto-data:/mosquitto/data
    entrypoint: ["/bin/sh", "/mosquitto/entrypoint.sh"]
    networks:
      - internal
    healthcheck:
      # Proves the broker accepts an authenticated client and that the ACL allows the subscription.
      # -E exits as soon as the broker acknowledges the SUBSCRIBE; -C 1 would wait for a message that
      # may never be published, which is why the old check reported `unhealthy` on a healthy broker.
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_BACKEND_USER\" -P \"$$MQTT_BACKEND_PASS\" -t 'systems/+/alarm' -E -W 3 >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


  # RTSP ingest + WebRTC (WHEP) media relay. Video never transits Next.js.
  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554" # RTSP publish from the Raspberry Pi
      - "8889:8889" # WebRTC WHEP signalling (browser)
      - "8189:8189/udp" # WebRTC ICE media
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    networks:
      - internal
    depends_on:
      security-camera-backend:
        condition: service_started
    healthcheck:
      # Validates the actual config file, so a YAML type error (which makes MediaMTX exit before it
      # ever binds :8554) shows up as `unhealthy` instead of silently crash-looping.
      test: ["CMD", "/mediamtx", "--validate-conf=/mediamtx.yml"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  # Public-facing: only the dashboard joins this one.
  edge:
    name: security-camera-edge
  # Private: no service here publishes a host port, so these containers are unreachable from
  # outside the Docker network. Egress stays enabled only because the backend talks to an external
  # PostgreSQL (Neon) and the factory IAM service.
  internal:
    name: security-camera-internal

volumes:
  captures:
    name: security-camera-captures
  # Holds the generated mosquitto password file and retained-message persistence.
  mosquitto-data:
    name: security-camera-mosquitto-data
  # Tailscale node identity: keeps the backend's tailnet name/IP stable across restarts.
  tailscale-state:
    name: security-camera-tailscale-state
