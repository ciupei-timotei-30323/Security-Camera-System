services:
  security-camera-backend:
    image: security-camera-backend
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: ${DB_URL}
      PiAuth__ApiKey: ${PiAuth__ApiKey}
      PiAuth__DefaultSystemId: ${PiAuth__DefaultSystemId:-sys-001}
      PiAuth__Systems__sys-002: ${PiAuth__Systems__sys-002:-dev-only-api-key-sys-002}
      PiAuth__AlertTerminalSystems__sys-001: ${PiAuth__AlertTerminalSystems__sys-001:-dev-alert-terminal-key-sys-001}
      PiAuth__AlertTerminalSystems__sys-002: ${PiAuth__AlertTerminalSystems__sys-002:-dev-alert-terminal-key-sys-002}
      Storage__CapturesDirectory: /data/captures
      CvService__BaseUrl: http://cv-service:8000
      CvService__TimeoutSeconds: 10
      Admin__DeviceCode: ${Admin__DeviceCode}
      Jwt__Secret: ${Jwt__Secret}
      # Outbound suspect alerts. Mailpit catches development e-mail at http://localhost:8025.
      Notifications__EmailCooldownSeconds: ${Notifications__EmailCooldownSeconds:-60}
      Notifications__DashboardBaseUrl: ${Notifications__DashboardBaseUrl:-http://localhost:5173}
      Notifications__EmailRetryBaseDelayMilliseconds: ${Notifications__EmailRetryBaseDelayMilliseconds:-1000}
      Smtp__Host: ${Smtp__Host:-mailpit}
      Smtp__Port: ${Smtp__Port:-1025}
      Smtp__UseStartTls: ${Smtp__UseStartTls:-false}
      Smtp__Username: ${Smtp__Username:-}
      Smtp__Password: ${Smtp__Password:-}
      Smtp__FromAddress: ${Smtp__FromAddress:-alerts@security-camera.local}
      Smtp__FromName: ${Smtp__FromName:-Security Camera}
      Alarm__DurationSeconds: ${Alarm__DurationSeconds:-15}
      # Factory-admin validation. Set UseStub=false and BaseUrl to the real IAM service later.
      ExternalAuth__UseStub: ${ExternalAuth__UseStub:-true}
      ExternalAuth__BaseUrl: ${ExternalAuth__BaseUrl:-http://external-auth:8080}
      ExternalAuth__TimeoutSeconds: ${ExternalAuth__TimeoutSeconds:-10}
      ExternalAuth__StubAccounts__cam_admin_1__SystemId: sys-001
      ExternalAuth__StubAccounts__cam_admin_1__Password: ${ExternalAuth__StubAccounts__cam_admin_1__Password:-factory-pass-sys-001}
      ExternalAuth__StubAccounts__cam_admin_1__PiApiKey: ${ExternalAuth__StubAccounts__cam_admin_1__PiApiKey:-dev-pi-key-sys-001}
      ExternalAuth__StubAccounts__cam_admin_2__SystemId: sys-002
      ExternalAuth__StubAccounts__cam_admin_2__Password: ${ExternalAuth__StubAccounts__cam_admin_2__Password:-factory-pass-sys-002}
      ExternalAuth__StubAccounts__cam_admin_2__PiApiKey: ${ExternalAuth__StubAccounts__cam_admin_2__PiApiKey:-dev-pi-key-sys-002}
    ports:
      - "8080:8080"
    volumes:
      # Shared with cv-service: raw frames in, face crops out. Never stored in PostgreSQL.
      - captures:/data/captures
    depends_on:
      cv-service:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped


  dashboard:
    image: security-camera-dashboard
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      # Server-side BFF target. The browser only talks to the dashboard origin.
      BACKEND_URL: http://security-camera-backend:8080
      NODE_ENV: production
      # Cookies are Secure by default in production. Set to true when serving over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      security-camera-backend:
        condition: service_started
    restart: unless-stopped


  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI: http://localhost:8025
    restart: unless-stopped


  cv-service:
    image: security-camera-cv-service
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    volumes:
      # Must match the exact mount path (/data/captures) used by the backend
      - captures:/data/captures
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 100s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  captures:
    name: security-camera-captures
